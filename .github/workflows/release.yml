name: release

# Build and publish fridashot binaries on every new version tag (e.g. v1.0.0).
# The tag is embedded in the binary via -ldflags -X main.version=<tag> and in the asset name.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # needed to create the GitHub Release and upload assets

env:
  # frida-core devkit version to link against (cgo). Bump together with the
  # github.com/frida/frida-go version in go.mod when upgrading Frida.
  FRIDA_VERSION: "17.2.11"

jobs:
  build:
    name: build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            goos: darwin
            goarch: arm64
            devkit: macos-arm64
          - os: macos-13
            goos: darwin
            goarch: amd64
            devkit: macos-x86_64
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            devkit: linux-x86_64

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Download frida-core devkit
        run: |
          set -eux
          mkdir -p devkit
          url="https://github.com/frida/frida/releases/download/${FRIDA_VERSION}/frida-core-devkit-${FRIDA_VERSION}-${{ matrix.devkit }}.tar.xz"
          curl -fL --retry 3 -o devkit.tar.xz "$url"
          tar -xf devkit.tar.xz -C devkit
          test -f devkit/frida-core.h
          test -f devkit/libfrida-core.a

      - name: Build
        env:
          CGO_ENABLED: "1"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_CFLAGS: "-I${{ github.workspace }}/devkit -w"
          CGO_LDFLAGS: "-L${{ github.workspace }}/devkit"
        run: |
          set -eux
          version="${GITHUB_REF_NAME}"
          out="fridashot-${version}-${{ matrix.goos }}-${{ matrix.goarch }}"
          go build -trimpath -ldflags "-s -w -X main.version=${version}" -o "${out}" .
          ./"${out}" -version || true
          shasum -a 256 "${out}" > "${out}.sha256" || sha256sum "${out}" > "${out}.sha256"

      - name: Upload build artifact
        uses: actions/upload-artifact@v5
        with:
          name: fridashot-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            fridashot-*-${{ matrix.goos }}-${{ matrix.goarch }}
            fridashot-*-${{ matrix.goos }}-${{ matrix.goarch }}.sha256

  release:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true

      - name: Create / update release with binaries
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
